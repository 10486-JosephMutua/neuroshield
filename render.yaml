services:
  - type: web
    name: neuroshield
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEUROSHIELD_FLASK_HOST
        value: 0.0.0.0
      - key: NEUROSHIELD_MCP_HOST
        value: 127.0.0.1
      - key: NEUROSHIELD_MAX_CONCURRENT_ANALYSES
        value: "1"
      - key: NEUROSHIELD_WATCHER
        value: "false"
      - key: NEUROSHIELD_ANALYSIS_CACHE
        value: "true"
      - key: NEUROSHIELD_DB_PATH
        value: /tmp/neuroshield.db
      - key: NEUROSHIELD_LOG_LEVEL
        value: WARNING
